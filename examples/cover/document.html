<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Konpeki — agent-authored visuals</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    [data-page] { padding: calc(8 * var(--kp-unit)) calc(9 * var(--kp-unit)); }
    h1 { max-width: 660px; }
    .summary { max-width: 610px; margin-top: calc(3 * var(--kp-unit)); color: var(--kp-muted); font-size: var(--kp-font-body); line-height: var(--kp-leading-body); }
    .formats { display: flex; gap: calc(3 * var(--kp-unit)); margin-top: calc(4 * var(--kp-unit)); padding-top: calc(2 * var(--kp-unit)); border-top: var(--kp-rule-width) solid var(--kp-accent); max-width: 560px; color: var(--kp-accent); font-size: var(--kp-font-fine); line-height: var(--kp-leading-fine); font-weight: var(--kp-weight-strong); }
    .diagram { position: absolute; right: 48px; top: 72px; width: 326px; height: 486px; stroke-width: var(--kp-rule-width); }
    .diagram text { font-size: var(--kp-font-fine); fill: var(--kp-fg); }
    .diagram .label { font-size: var(--kp-font-caption); font-weight: var(--kp-weight-strong); }
    .footer { position: absolute; left: 72px; bottom: 40px; color: var(--kp-muted); font-size: var(--kp-font-fine); line-height: var(--kp-leading-fine); }
  </style>
</head>
<body>
  <main id="cover-page" data-page data-size="link">
    <h1 id="cover-title" data-type="display">Create clear visuals with your coding agent.</h1>
    <p id="cover-summary" class="summary">Readable HTML is the source. PNG and PDF are the artifacts. Optional review keeps feedback close to the work.</p>
    <div id="cover-formats" class="formats" aria-label="Konpeki formats"><span>HTML source</span><span>PNG</span><span>PDF</span></div>
    <svg id="cover-diagram" class="diagram" viewBox="0 0 326 486" role="img" aria-label="HTML source flowing to PNG and PDF artifacts, with an optional review note">
      <rect id="source-card" x="18" y="18" width="240" height="154" fill="var(--kp-wash)" stroke="var(--kp-accent)"/>
      <text id="source-label" x="42" y="62" class="label">document.html</text>
      <path id="source-lines" d="M42 88h150M42 110h176M42 132h122" fill="none" stroke="var(--kp-sequence-3)" stroke-width="var(--kp-stroke-heavy)"/>
      <path id="artifact-arrow" d="M138 173v69m-9-12 9 12 9-12" fill="none" stroke="var(--kp-accent)" stroke-width="var(--kp-stroke)"/>
      <rect id="png-card" x="18" y="254" width="116" height="92" fill="var(--kp-bg)" stroke="var(--kp-accent)"/>
      <rect id="pdf-card" x="146" y="254" width="116" height="92" fill="var(--kp-bg)" stroke="var(--kp-accent)"/>
      <text id="png-label" x="76" y="308" text-anchor="middle" class="label">PNG</text>
      <text id="pdf-label" x="204" y="308" text-anchor="middle" class="label">PDF</text>
      <path id="review-connector" d="M258 95h35v325h-31" fill="none" stroke="var(--kp-muted)" stroke-dasharray="6 6"/>
      <rect id="review-card" x="66" y="382" width="196" height="76" fill="var(--kp-wash)" stroke="var(--kp-accent)" stroke-dasharray="4 4"/>
      <circle id="review-dot" cx="93" cy="420" r="5" fill="var(--kp-accent)"/>
      <text id="review-label" x="110" y="425">optional review</text>
    </svg>
    <p id="cover-footer" class="footer">Agent-first authoring · human-readable source</p>
  </main>
</body>
</html>
