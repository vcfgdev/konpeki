name: Stage package release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v4
        with:
          cache: false

      - name: Verify tag matches package version
        run: test "$GITHUB_REF_NAME" = "$(mise exec -- node -p "require('./package.json').version")"

      - run: mise exec -- pnpm install --frozen-lockfile
      - run: mise exec -- pnpm check
      - run: mise exec -- pnpm test
      - run: mise exec -- pnpm build
      - run: mise exec -- pnpm check:package

      - name: Pack and smoke-test the release tarball
        run: |
          mkdir -p "$RUNNER_TEMP/release" "$RUNNER_TEMP/smoke"
          mise exec -- npm pack --pack-destination "$RUNNER_TEMP/release"
          mise exec -- npm install --prefix "$RUNNER_TEMP/smoke" --no-audit --no-fund "$RUNNER_TEMP/release/konpeki-$GITHUB_REF_NAME.tgz"
          cp slides/introducing-konpeki/composition.json "$RUNNER_TEMP/smoke/composition.json"
          mise exec -- node "$RUNNER_TEMP/smoke/node_modules/konpeki/runtime/konpeki.mjs" validate "$RUNNER_TEMP/smoke/composition.json"
          mise exec -- node "$RUNNER_TEMP/smoke/node_modules/vite/bin/vite.js" build "$RUNNER_TEMP/smoke/node_modules/konpeki" --outDir "$RUNNER_TEMP/smoke/dist"

      - name: Stage tested tarball for npm approval
        run: mise exec -- npm stage publish "$RUNNER_TEMP/release/konpeki-$GITHUB_REF_NAME.tgz" --access public
